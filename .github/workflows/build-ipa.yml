name: Build iOS (Experimental)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    branches: [dev]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [dev]

env:
  DOTNET_VERSION: '10.0'
  TARGET_FRAMEWORK: 'net10.0-ios'
  RUNTIME_IDENTIFIER: 'ios-arm64'
  PROJECT_PATH: 'OpenUtauMobile/OpenUtauMobile.csproj'

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 2. 设置 Xcode
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      # 3. 安装 .NET 10 SDK
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}.x'

      # 4. 安装 iOS 工作负载
      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          dotnet workload list

      # 5. 恢复依赖
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            -p:TargetFramework=${{ env.TARGET_FRAMEWORK }}

      # 6. 构建 iOS 项目
      - name: Build iOS
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            -f ${{ env.TARGET_FRAMEWORK }} \
            -c ${{ github.event.inputs.configuration || 'Debug' }} \
            -p:RuntimeIdentifier=${{ env.RUNTIME_IDENTIFIER }} \
            -p:TargetFrameworks=${{ env.TARGET_FRAMEWORK }} \
            --no-restore
        continue-on-error: true

      # 7. 列出构建输出（用于调试）
      - name: List build output
        if: always()
        run: |
          echo "=== Searching for build artifacts ==="
          find . -name "*.app" -o -name "*.ipa" -o -name "*.dll" 2>/dev/null | head -20
          echo "=== bin directory structure ==="
          ls -R OpenUtauMobile/bin/ 2>/dev/null || echo "bin directory not found"

      # 8. 上传构建日志（无论成功与否）
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifacts-${{ github.run_id }}
          path: |
            OpenUtauMobile/bin/
            OpenUtauMobile/obj/
          retention-days: 7

      # 9. 上传编译产物（仅成功时）
      - name: Upload iOS App
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS
          path: |
            OpenUtauMobile/bin/${{ github.event.inputs.configuration || 'Debug' }}/${{ env.TARGET_FRAMEWORK }}/${{ env.RUNTIME_IDENTIFIER }}/publish/*.ipa
            OpenUtauMobile/bin/${{ github.event.inputs.configuration || 'Debug' }}/${{ env.TARGET_FRAMEWORK }}/${{ env.RUNTIME_IDENTIFIER }}/*.app
          if-no-files-found: warn
          retention-days: 14

