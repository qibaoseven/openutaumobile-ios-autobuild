name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    branches: [dev]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [dev]

env:
  DOTNET_VERSION: '10.0'
  TARGET_FRAMEWORK: 'net10.0-ios'
  RUNTIME_IDENTIFIER: 'ios-arm64'
  PROJECT_PATH: 'OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Create link.xml to skip AppKit
        run: |
          mkdir -p OpenUtauMobile.iOS
          cat > OpenUtauMobile.iOS/link.xml << 'EOF'
          <linker>
            <assembly fullname="OpenUtau.Core" preserve="all"/>
            <assembly fullname="OpenUtauMobile" preserve="all"/>
            <assembly fullname="OpenUtau.Plugin.Builtin" preserve="all"/>
            <assembly fullname="OpenUtauMobile.Plugin.Renderers" preserve="all"/>
          </linker>
          EOF
          echo "✅ link.xml created:"
          cat OpenUtauMobile.iOS/link.xml

      - name: Debug - Scan for AppKit references
        run: |
          echo "=== Scanning .cs files for AppKit ==="
          grep -rn "AppKit" --include="*.cs" . || echo "✅ No AppKit in .cs files"
          echo ""
          echo "=== Scanning .csproj files for AppKit ==="
          grep -rn "AppKit" --include="*.csproj" . || echo "✅ No AppKit in .csproj files"

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build .app (unsigned)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -f ${{ env.TARGET_FRAMEWORK }} \
            -c ${{ github.event.inputs.configuration || 'Debug' }} \
            -r ${{ env.RUNTIME_IDENTIFIER }} \
            -p:EnableCodeSigning=false \
            -p:MtouchLink=Full \
            -p:MtouchExtraArgs="--linkskip=AppKit --link-ignore=AppKit" \
            -p:TrimmerRootAssembly="OpenUtau.Core" \
            -p:TrimmerRootAssembly="OpenUtauMobile" \
            -p:TrimmerRootAssembly="OpenUtau.Plugin.Builtin" \
            -p:TrimmerRootAssembly="OpenUtauMobile.Plugin.Renderers" \
            -p:TrimmerRootDescriptor="OpenUtauMobile.iOS/link.xml" \
            --no-restore

      - name: Package .app to .ipa (unsigned)
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Debug' }}"
          APP_PATH="OpenUtauMobile.iOS/bin/${CONFIG}/${{ env.TARGET_FRAMEWORK }}/${{ env.RUNTIME_IDENTIFIER }}/publish/OpenUtauMobile.iOS.app"
          
          echo "Looking for .app at: $APP_PATH"
          
          if [ -d "$APP_PATH" ]; then
            echo "✅ .app found at $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r OpenUtauMobile.ipa Payload
            echo "✅ IPA created successfully (unsigned)"
            ls -lh OpenUtauMobile.ipa
          else
            echo "❌ .app not found at $APP_PATH"
            echo "Trying to find .app anywhere in bin folder..."
            find OpenUtauMobile.iOS/bin -name "*.app" -type d 2>/dev/null || echo "No .app found"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS-IPA
          path: OpenUtauMobile.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts (fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-fallback-${{ github.run_id }}
          path: |
            OpenUtauMobile.iOS/bin/
            OpenUtauMobile.iOS/obj/
          retention-days: 7