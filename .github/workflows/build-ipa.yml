name: Build MAUI iOS IPA (Unsigned)

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Fix Homebrew tap trust
        run: |
          brew untap aws/tap 2>/dev/null || true
          echo "HOMEBREW_NO_REQUIRE_TAP_TRUST=1" >> $GITHUB_ENV

      - name: Install .NET 10.0 SDK
        run: |
          brew install --cask dotnet-sdk
      
      - name: Install MAUI iOS workload
        run: |
          sudo dotnet workload install maui-ios --no-cache
      
      - name: Restore dependencies (iOS only)
        run: |
          # 清缓存（解决权限警告）
          sudo rm -rf ~/.local/share/NuGet/http-cache || true
          # 分别 restore 每个项目，指定对应框架
          dotnet restore OpenUtau.Core/OpenUtau.Core.csproj -p:TargetFramework=net10.0
          dotnet restore OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj -p:TargetFramework=net10.0
          dotnet restore OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj -p:TargetFramework=net10.0
          dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFrameworks="net10.0;net10.0-ios"
      
      - name: Build unsigned IPA
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net10.0-ios \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false \
            -p:PackageFormat=ipa
      
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-unsigned
          path: OpenUtauMobile/bin/Debug/net10.0-ios/ios-arm64/publish/*.ipa
