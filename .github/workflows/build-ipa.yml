name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
  push:
    branches: [dev]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.sln'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [dev]

env:
  DOTNET_VERSION: '10.0'
  TARGET_FRAMEWORK: 'net10.0-ios'
  RUNTIME_IDENTIFIER: 'ios-arm64'
  PROJECT_PATH: 'OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Create link.xml
        run: |
          mkdir -p OpenUtauMobile.iOS
          cat > OpenUtauMobile.iOS/link.xml << 'EOF'
          <linker>
            <assembly fullname="OpenUtau.Core" preserve="all"/>
            <assembly fullname="OpenUtauMobile" preserve="all"/>
            <assembly fullname="OpenUtau.Plugin.Builtin" preserve="all"/>
            <assembly fullname="OpenUtauMobile.Plugin.Renderers" preserve="all"/>
          </linker>
          EOF
          echo "✅ link.xml created"

      - name: Debug - Scan for AppKit references
        run: |
          echo "=== Scanning .cs files for AppKit ==="
          grep -rn "AppKit" --include="*.cs" . || echo "✅ No AppKit in .cs files"
          echo ""
          echo "=== Scanning .csproj files for AppKit ==="
          grep -rn "AppKit" --include="*.csproj" . || echo "✅ No AppKit in .csproj files"

      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build .app (unsigned)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -f ${{ env.TARGET_FRAMEWORK }} \
            -c ${{ github.event.inputs.configuration || 'Debug' }} \
            -r ${{ env.RUNTIME_IDENTIFIER }} \
            -p:EnableCodeSigning=false \
            -p:MtouchLink=SdkOnly \
            -p:MtouchExtraArgs="-gcc_flags '-Wl,-weak_framework,AppKit'" \
            -p:TrimmerRootAssembly="OpenUtau.Core" \
            -p:TrimmerRootAssembly="OpenUtauMobile" \
            -p:TrimmerRootAssembly="OpenUtau.Plugin.Builtin" \
            -p:TrimmerRootAssembly="OpenUtauMobile.Plugin.Renderers" \
            -p:TrimmerRootDescriptor="OpenUtauMobile.iOS/link.xml" \
            --no-restore

      - name: Find and verify .app
        run: |
          CONFIG="${{ github.event.inputs.configuration || 'Debug' }}"
          
          # 搜索 .app 文件的实际位置
          echo "🔍 Searching for .app bundle..."
          APP_PATH=$(find OpenUtauMobile.iOS/bin -name "*.app" -type d -print -quit 2>/dev/null || echo "")
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "✅ Found .app at: $APP_PATH"
            
            # 获取二进制文件名（从 Info.plist 读取）
            BINARY_NAME=$(plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist" 2>/dev/null || echo "")
            if [ -z "$BINARY_NAME" ]; then
              # 如果读取失败，用文件夹名
              BINARY_NAME=$(basename "$APP_PATH" .app)
            fi
            
            BINARY_PATH="$APP_PATH/$BINARY_NAME"
            
            if [ -f "$BINARY_PATH" ]; then
              echo "🔍 Checking binary for AppKit references..."
              if otool -L "$BINARY_PATH" 2>/dev/null | grep -q AppKit; then
                echo "⚠️ WARNING: AppKit still found in binary!"
                otool -L "$BINARY_PATH" | grep AppKit
              else
                echo "✅ AppKit successfully stripped from binary."
              fi
              
              # 保存路径供后续步骤使用
              echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
            else
              echo "⚠️ Binary not found at expected path: $BINARY_PATH"
              echo "Checking binary name from Info.plist..."
              plutil -p "$APP_PATH/Info.plist" || true
            fi
          else
            echo "❌ No .app bundle found in bin folder!"
            echo "Contents of bin folder:"
            find OpenUtauMobile.iOS/bin -type d -maxdepth 3 2>/dev/null || echo "No bin folder"
            exit 1
          fi

      - name: Package .app to .ipa (unsigned)
        run: |
          if [ -z "$APP_PATH" ]; then
            echo "❌ APP_PATH not set, searching again..."
            APP_PATH=$(find OpenUtauMobile.iOS/bin -name "*.app" -type d -print -quit 2>/dev/null || echo "")
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ No .app found to package"
            exit 1
          fi
          
          echo "📦 Packaging: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r OpenUtauMobile.ipa Payload
          echo "✅ IPA created successfully"
          ls -lh OpenUtauMobile.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-iOS-IPA
          path: OpenUtauMobile.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build artifacts (fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-fallback-${{ github.run_id }}
          path: |
            OpenUtauMobile.iOS/bin/
            OpenUtauMobile.iOS/obj/
          retention-days: 7